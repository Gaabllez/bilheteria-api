name: Validacao da bilheteria
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Preservar arquivos originais do professor
        run: node validacao/conferir-originais.mjs
      - run: npm run typecheck
      - name: Testes oficiais pelo comando do projeto
        run: npm test
      - name: Exigir os 16 pontos oficiais
        run: node validacao/conferir-testes.mjs
      - name: Regressões de API, concorrência, catálogo e gate
        run: node --import tsx --test validacao/backend.test.ts validacao/infra.test.mjs validacao/catalogo.test.ts
      - name: Ensaiar erro de concorrência em cópia temporária e confirmar restauração
        run: node validacao/demonstrar-concorrencia.mjs
      - name: Verificar JavaScript da interface
        run: node --check public/app.js
      - name: Benchmark HTTP
        shell: bash
        run: |
          mkdir -p coverage
          npm start > coverage/servidor.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/eventos > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/eventos
          npm run bench | tee coverage/benchmark.log
          node validacao/conferir-benchmark.mjs coverage/benchmark.log
          cat coverage/benchmark.log >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar evidências do benchmark
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: benchmark
          path: coverage/*.log
          if-no-files-found: ignore
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Instalar navegador de teste sem alterar o projeto do professor
        run: |
          npm install --prefix "$RUNNER_TEMP/bilheteria-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/bilheteria-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Fluxos da interface em desktop e celular
        env:
          PLAYWRIGHT_MODULE_PATH: ${{ runner.temp }}/bilheteria-browser/node_modules/playwright/index.mjs
        run: node --import tsx --test --test-concurrency=1 validacao/browser.test.mjs
      - name: Conferir originais após os testes
        run: node validacao/conferir-originais.mjs
      - name: Guardar evidências da interface
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: interface
          path: coverage/ui/
          if-no-files-found: ignore
